  <text x="64" y="216" font-size="28" fill="#ECF0F0">Diagnóstico, controle e otimização.</text>
  <text x="64" y="256" font-size="19" fill="#B9C5D2">Conheça o sistema. Meça o impacto de cada mudança.</text>
  <text x="64" y="312" font-size="13" letter-spacing="3" fill="#93A1B3">ANDROID TV  ·  ADB  ·  PROCESSAMENTO EXTERNO</text>
 </g>
