<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
 <title id="title">MODTV — Smart TV Toolkit</title>
 <desc id="desc">Diagnóstico, controle e otimização de Android TV, com fundo azul profundo e destaque âmbar.</desc>
