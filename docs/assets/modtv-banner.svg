  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0B1018"/><stop offset="1" stop-color="#141F33"/></linearGradient>
  <radialGradient id="warm"><stop stop-color="#E39A2D" stop-opacity=".24"/><stop offset="1" stop-color="#E39A2D" stop-opacity="0"/></radialGradient>
  <radialGradient id="cool"><stop stop-color="#3A60BE" stop-opacity=".30"/><stop offset="1" stop-color="#3A60BE" stop-opacity="0"/></radialGradient>
  <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#ECF0F0" stop-opacity=".09"/><stop offset="1" stop-color="#ECF0F0" stop-opacity=".025"/></linearGradient>
 </defs>
 <rect x="1" y="1" width="1278" height="358" rx="28" fill="url(#bg)" stroke="#B9C5D2" stroke-opacity=".14"/>
 <ellipse cx="1120" cy="80" rx="340" ry="270" fill="url(#warm)"/>
